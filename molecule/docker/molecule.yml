---
dependency:
  name: galaxy
driver:
  name: default
platforms:
  - name: almalinux10
    image: docker.io/almalinux:10
    command: sleep 1d
    privileged: true
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
  - name: resolute
    image: docker.io/ubuntu:resolute
    command: sleep 1d
    privileged: true
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
  - name: trixie
    image: docker.io/debian:trixie-slim
    command: sleep 1d
    privileged: true
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
provisioner:
  name: ansible
  playbooks:
    converge: "../resources/converge.yml"
    prepare: "../resources/prepare.yml"
    verify: "../resources/verify.yml"
  config_options:
    defaults:
      callbacks_enabled: "ansible.posix.profile_tasks,community.general.log_plays"
      # The plays run with strategy free, so hosts no longer report in step.
      # Drop the skipped hosts from the terminal, they are the bulk of the
      # interleaved noise, and keep a readable per host transcript on disk.
      display_skipped_hosts: false
      interpreter_python: "auto_silent"
    callback_log_plays:
      log_folder: "${MOLECULE_PROJECT_DIRECTORY}/molecule-logs/${MOLECULE_SCENARIO_NAME}"
  env:
    ANSIBLE_ROLES_PATH: "${MOLECULE_PROJECT_DIRECTORY}/.."
  log: true
  inventory:
    links:
      group_vars: inventory/group_vars
      host_vars: inventory/host_vars
verifier:
  name: ansible
scenario:
  name: docker
  create_sequence:
    - dependency
    - create
    - prepare
  test_sequence:
    - dependency
    - cleanup
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - idempotence
    - side_effect
    - verify
    - cleanup
    - destroy
